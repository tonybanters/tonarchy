name: Bug Report
description: File a detailed bug to help us improve tonarchy
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve tonarchy! Please fill out all sections below for a faster resolution.

  - type: input
    id: title
    attributes:
      label: Short summary
      description: Briefly describe the bug
      placeholder: "Touchpad tap-to-click not working on XFCE"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is and what you expected to happen.
      placeholder: "When I ... I expected ... but instead ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Mode (Beginner/XFCE or Oxidized/OXWM), hardware (laptop model, touchpad type), ISO version or commit hash, and any customizations.
      placeholder: "Beginner/XFCE, Dell XPS 13, ISO 2026.02.05, no customizations"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: If applicable, add screenshots or paste relevant log output to help explain your problem.
      placeholder: "Paste logs or drag screenshots here."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Is there anything else we should know? (e.g., did this work before, is it intermittent, etc.)
      placeholder: "Any other details..."
    validations:
      required: false
